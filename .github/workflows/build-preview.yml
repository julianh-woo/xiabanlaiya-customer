name: Build and Preview WeChat Mini Program

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: |
          cd apps/customer
          npm ci
        timeout-minutes: 30
      
      - name: Build Taro project
        run: |
          cd apps/customer
          npm run build:weapp
        timeout-minutes: 15
      
      - name: Preview with miniprogram-ci
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          retry_wait_seconds: 30
          command: |
            cd apps/customer
            npm run preview
          retry_count: 3
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        continue-on-error: true
      
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: apps/customer/preview-qrcode.jpg
          retention-days: 7
