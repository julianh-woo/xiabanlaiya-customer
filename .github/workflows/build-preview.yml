name: Build and Preview WeChat Mini Program

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Yarn
        run: npm install -g yarn
      
      - name: Cache node_modules
        uses: actions/cache@v4
        id: node-cache
        with:
          path: |
            apps/customer/node_modules
          key: ${{ runner.os }}-node20-${{ hashFiles('apps/customer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-
      
      - name: Install dependencies
        run: |
          cd apps/customer
          yarn install --network-timeout 600000
        timeout-minutes: 45
      
      - name: Build Taro project
        run: |
          cd apps/customer
          yarn build:weapp
        timeout-minutes: 20
      
      - name: Preview with miniprogram-ci
        run: |
          cd apps/customer
          yarn preview
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        continue-on-error: true
        timeout-minutes: 15
      
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: apps/customer/preview-qrcode.jpg
          retention-days: 7
