name: Build and Preview WeChat Mini Program

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/customer/node_modules
          key: ${{ runner.os }}-node20-v1-${{ hashFiles('apps/customer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-v1-
            ${{ runner.os }}-node20-
      
      - name: Check node_modules
        run: |
          echo "node_modules状态:"
          ls apps/customer/node_modules/.bin/taro 2>/dev/null && echo "✅ taro已安装" || echo "❌ taro未安装"
          ls apps/customer/node_modules/.bin/npm 2>/dev/null && echo "✅ npm已安装" || echo "❌ npm未安装"
      
      - name: Install dependencies
        run: |
          cd apps/customer
          if [ -f node_modules/.bin/taro ]; then
            echo "taro已存在，跳过npm install"
          else
            echo "开始安装依赖..."
            npm ci
          fi
        timeout-minutes: 90
      
      - name: Build Taro project
        run: |
          cd apps/customer
          npm run build:weapp
        timeout-minutes: 20
      
      - name: Preview with miniprogram-ci
        run: |
          cd apps/customer
          node preview.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        continue-on-error: true
        timeout-minutes: 15
      
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: apps/customer/preview-qrcode.jpg
          retention-days: 7
