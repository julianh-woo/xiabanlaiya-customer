name: Build and Preview WeChat Mini Program

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/customer/node_modules
          key: ${{ runner.os }}-node20-v1-${{ hashFiles('apps/customer/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node20-v1-
            ${{ runner.os }}-node20-
      
      # - name: Install dependencies
      #   run: |
      #     cd apps/customer
      #     npm ci --prefer-offline
      #   timeout-minutes: 40
      # 注：如果缓存命中，node_modules已存在，可跳过安装直接构建
      
      - name: Build Taro project
        run: |
          cd apps/customer
          npm run build:weapp
        timeout-minutes: 20
      
      - name: Preview with miniprogram-ci
        run: |
          cd apps/customer
          node preview.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        continue-on-error: true
        timeout-minutes: 15
      
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: apps/customer/preview-qrcode.jpg
          retention-days: 7
