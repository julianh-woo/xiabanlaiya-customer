name: Build and Preview WeChat Mini Program

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install pnpm
        run: npm install -g pnpm
      
      - name: Cache pnpm
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/customer/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      
      - name: Setup pnpm
        run: |
          pnpm config set store-dir ~/.pnpm-store
          pnpm config set registry https://registry.npmmirror.com
      
      - name: Install dependencies
        run: |
          cd apps/customer
          for i in 1 2 3 4 5; do
            echo "安装尝试 $i/5..."
            if pnpm install --prefer-offline; then
              echo "安装成功"
              break
            fi
            echo "安装失败，30秒后重试..."
            sleep 30
          done
        timeout-minutes: 60
      
      - name: Build Taro project
        run: |
          cd apps/customer
          pnpm build:weapp
        timeout-minutes: 20
      
      - name: Preview with miniprogram-ci
        run: |
          cd apps/customer
          node preview.js
        env:
          WECHAT_APPID: ${{ secrets.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
        continue-on-error: true
        timeout-minutes: 15
      
      - name: Upload preview artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: preview-qrcode
          path: apps/customer/preview-qrcode.jpg
          retention-days: 7
